# Patent Review System — 規則設定檔
# 所有數值、清單、樣式都在這裡調整；程式不寫死規格值。
# severity 可用：必改 / 建議 / 需人工確認 / 資訊
# basis 欄位記錄依據；標「事務所規格」者為內部慣例，請依實際規範確認後修改。

rules_version: "2026.10.30"

# ─────────────────────────────────────────
# 檢查階段：同一套規則，依撰寫進度啟用不同檢查群組
#   claims：請求項初稿（docx 可以只有請求項）
#   draft ：完整說明書初稿（說明書＋請求項＋摘要，圖式可選）
#   final ：送件版（全部檢查，含格式殘留、字型、圖式 PDF、規費）
# 群組名稱見下方註解；委員會調整規則時只需改這裡
# ─────────────────────────────────────────
stages:
  claims:
    label: 請求項初稿
    groups: [claims_core, antecedent, width, units, semantic]
  draft:
    label: 說明書初稿
    groups: [sections, paragraph_numbers, abstract, width, units,
             claims_core, antecedent, support, symbols, figures, rep_figure, semantic]
  final:
    label: 送件版
    groups: [sections, paragraph_numbers, typography, width, units, abstract, residue, conversion, fees,
             claims_core, antecedent, support, symbols, figures, rep_figure, pdf, semantic]
default_stage: final
# 群組對應：
#   sections=A01 段落標題  paragraph_numbers=A02 段號  typography=A03 字型行距
#   width=A04 全半形  units=A05 用語單位  abstract=A06 摘要字數  residue=A07 編修殘留
#   conversion=A08 轉檔風險  fees=A09 規費試算
#   claims_core=B01–B04 編號/一句/依附/前言  antecedent=B05 前置基礎  support=B06 說明書支持
#   symbols=C01–C05 符號對照  figures=C06–C08 圖號  rep_figure=C09 代表圖
#   pdf=D01–D09 圖式 PDF  semantic=E01–E02 語意

# ─────────────────────────────────────────
# A. 說明書格式
# ─────────────────────────────────────────
sections:
  # 依序列出必備段落；pattern 為標題段落的正規式（整段比對，已去除前後空白）
  # 一個段落可同時接受新舊兩種寫法
  required:
    - {key: title,        name: 發明名稱,               pattern: '^【(中文)?發明名稱】'}
    - {key: field,        name: 技術領域,               pattern: '^【技術領域】$'}
    - {key: prior_art,    name: 先前技術,               pattern: '^【先前技術】$'}
    - {key: summary,      name: 發明內容,               pattern: '^【發明內容】$'}
    - {key: drawings,     name: 圖式簡單說明,           pattern: '^【圖式簡單說明】$'}
    - {key: embodiments,  name: 實施方式,               pattern: '^【實施方式】$'}
    - {key: symbols,      name: 符號說明,               pattern: '^【符號說明】$'}
    - {key: claims,       name: 申請專利範圍,           pattern: '^【(發明)?申請專利範圍】$'}
    - {key: abstract,     name: 摘要,                   pattern: '^【(發明)?摘要】$'}
    - {key: rep_figure,   name: 代表圖,                 pattern: '^【(指定)?代表圖】'}
    - {key: rep_symbols,  name: 代表圖之符號簡單說明,   pattern: '^【代表圖之符號簡單說明】$'}
  # 可出現但不檢查順序的標題（避免被當成未知段落）
  optional:
    - {key: title_en,     pattern: '^【英文發明名稱】'}
    - {key: abstract_zh,  pattern: '^【中文】$'}
    - {key: abstract_en,  pattern: '^【英文】$'}
    - {key: spec_header,  pattern: '^【發明說明書】$'}
    - {key: deposit,      pattern: '^【生物材料寄存】$'}
    - {key: sequence,     pattern: '^【序列表】$'}
    - {key: formula,      pattern: '^【特徵化學式】$'}
    - {key: drawings_hdr, pattern: '^【發明圖式】$'}
  severity: 必改
  basis: 專利法施行細則第17條（說明書記載事項及順序）

paragraph_numbers:
  pattern: '^【(\d{4})】'          # 純文字段號
  auto_number_marker: '【'          # Word 自動編號的 lvlText 含此字元即視為段號
  # 只在這些段落內要求段號（申請專利範圍、摘要不編段號）
  numbered_sections: [field, prior_art, summary, drawings, embodiments, symbols]
  # 這些段落內未編號的清單列（例如符號說明逐行列出）不報缺段號
  list_sections_allow_unnumbered: [symbols]
  start: 1
  allow_mixed: false               # 同一份文件混用自動編號與純文字 → 報告
  severity: 必改
  basis: 專利法施行細則第17條第4項（段落編號）

typography:
  enabled: true
  severity: 建議
  basis: 事務所規格（請依實際送件格式確認）
  # 字型名稱別名：Mac 與 Windows 名稱不同，列在同一組視為相同
  font_aliases:
    標楷體: [標楷體, DFKai-SB, BiauKai, "BiauKai TC", "Kaiti TC"]
    新細明體: [新細明體, PMingLiU, "PMingLiU-ExtB", "Apple LiSung", LiSong Pro]
    Times New Roman: [Times New Roman, TimesNewRomanPSMT]
  east_asia_fonts: [標楷體, 新細明體]   # 允許的中文字型（以 font_aliases 鍵名表示）
  ascii_fonts: [Times New Roman]
  size_pt: {min: 12, max: 14}
  line_spacing:                       # 倍數行距；exact/atLeast 以 pt 表示
    multiple: {min: 1.5, max: 2.0}
  alignment: [both, left, justify, distribute, null]   # null = 繼承預設
  max_listed: 30                      # 同一規則最多列出幾段，其餘彙總

width_check:
  enabled: true
  severity: 必改
  basis: 事務所規格（中文語境使用全形標點）
  # 這些半形字元若緊鄰中日韓字元即報告
  halfwidth_chars: '(),:;'
  fullwidth_map: {'(': '（', ')': '）', ',': '，', ':': '：', ';': '；'}
  # 不檢查的段落（例如英文摘要、英文名稱）
  skip_sections: [title_en, abstract_en]

unit_consistency:
  enabled: true
  severity: 建議
  basis: 事務所規格（同一文件用語一致）
  # 每組只能擇一使用；同一組內出現兩種以上即報告
  groups:
    - ['±', '加減']
    - ['μm', 'µm', '微米']
    - ['nm', '奈米']
    - ['mm', '毫米']
    - ['℃', '°C', '攝氏']
    - ['%', '百分比']

abstract:
  max_chars: 250
  count_whitespace: false
  count_punctuation: true
  severity: 必改
  basis: 專利法施行細則第21條（摘要不得超過二百五十字）

residue:
  severity: 必改
  basis: 事務所規格（送件前清除編修痕跡）
  check_tracked_changes: true
  check_comments: true
  check_highlight: true
  check_color: true
  allowed_colors: [auto, '000000']
  check_hidden: true
  check_empty_paragraphs: true
  empty_paragraph_severity: 建議

fees:
  enabled: true
  severity: 資訊
  basis: 專利規費收費辦法（請以最新版本確認）
  claims_free: 10          # 超過此項數加收
  pages_free: 50           # 說明書＋申請專利範圍＋圖式超過此頁數加收

# ─────────────────────────────────────────
# B. 申請專利範圍
# ─────────────────────────────────────────
claims:
  # 每個請求項起始；第 1 組為項號
  start_patterns:
    - '^【第\s*(\d+)\s*項】'
    - '^(\d+)\s*[\.、．]'
  # 依附語句（前言內）：抓出被依附的項號
  ref_pattern: '(?:申請專利範圍第|請求項)\s*(\d+)\s*(?:項)?(?:\s*(?:至|到|~|～|－|-)\s*(?:請求項|第)?\s*(\d+)\s*(?:項)?)?'
  list_continuation: '^\s*[、,，或及和與]\s*(?:請求項|第)?\s*(\d+)'
  preamble_end: '[，,：:]'          # 前言結束符號
  alternative_words: ['或', '任一', '其中一', '其中之一', '之一']
  conjunctive_words: ['及', '和', '與', '以及']
  one_sentence: true                # 每項只能有一個句號
  severity: 必改
  basis: 專利法施行細則第18條（依附、多項附屬須擇一且不得依附多項附屬項）

antecedent:
  enabled: true
  severity: 必改
  basis: 專利審查基準第二篇第一章（前置基礎）
  intro_markers: ['至少一個', '至少一', '一或多個', '一個或多個', '一對', '一組', '一個', '一種', '一', '多個', '複數個', '複數', '若干', '兩個', '二個', '兩', '二']
  ref_markers: ['所述的', '所述之', '所述', '該些', '該等', '該', '前述']
  # 這些詞前面的「一」不是引入（例如「第一」「其中一」「同一」「唯一」）
  not_intro_prefix: ['第', '其中', '同', '唯', '單', '統', '之', '另', '任', '每', '逐']
  # 額外補充的元件名稱（不在符號說明中的抽象元件，例如「處理單元」）
  extra_terms: []
  # 不採計的通用詞
  ignore_terms: ['方法', '裝置', '系統', '步驟']
  support_check:
    enabled: true
    severity: 需人工確認
    stop_chars: '，。、；：（）()及與和或之的於在設具包連係為被以並且將使用其中可經由對向自從至到中上下內外間一個種'
    min_len: 2
    max_len: 12
  # 名稱推得用：長度達 2 字後遇到這些字（多為動詞）即視為名稱結束
  term_end_chars: '覆設具包連穿位用為係與於並可能是有沿經透接固形提供使令將被由至對向延伸容置配置'

# ─────────────────────────────────────────
# C. 符號與圖式對應
# ─────────────────────────────────────────
symbols:
  severity: 必改
  basis: 專利法施行細則第19、20條（圖式、符號說明）
  # 符號說明的一行：「10：光纖」「10、10a 光纖」
  list_line: '^\s*([A-Za-z]?\d+[A-Za-z]?[’''′]?(?:\s*[、,，]\s*[A-Za-z]?\d+[A-Za-z]?[’''′]?)*)\s*[：:\s]\s*(\S.*?)\s*$'
  # 內文中的符號：名稱後面接的編號
  body_symbol: '(?<![A-Za-z0-9.])([A-Za-z]?\d{1,4}[a-z]?[’''′]?)(?![0-9A-Za-z.])'
  # 符號前若是這些字，就不是元件符號（圖號、請求項、數值）
  not_symbol_prefix: ['圖', '第', '項', '約', '為', '達', '共', '於', '至', '到', '和', '及', '或', '、', '【', 'S', '步驟', '公式', '式']
  # 符號後若接這些字，就是數值／量詞
  not_symbol_suffix: ['個', '根', '條', '片', '層', '組', '次', '倍', '度', '年', '月', '日', '項', '點', '%', '℃', '°', 'm', 'n', 'μ', 'µ', 'k', 'M', 'G', 'H', 'V', 'A', 'W', 's', 'x', '×', '圖', '秒', '分', '小時', '公', '毫', '微', '奈', '倍']
  same_name_two_symbols_severity: 建議
  unused_in_body_severity: 建議

figures:
  severity: 必改
  basis: 專利法施行細則第20、23條（圖式及圖式簡單說明）
  # 圖式簡單說明中宣告圖號（「圖1為…」「第1圖係…」）
  declare_pattern: '^\s*(?:圖\s*(\d+[A-Za-z]?)|第\s*(\d+[A-Za-z]?)\s*圖)\s*(?:係|為|是|：|:|，|顯示|繪示|表示)'
  # 內文引用（「圖1」「第1圖」）；後續「至圖3」「、3」由程式展開
  ref_pattern: '(?:圖\s*(\d+[A-Za-z]?)|第\s*(\d+[A-Za-z]?)\s*圖)'
  range_words: ['至', '到', '~', '～', '-', '－']
  list_words: ['、', '及', '和', '與']
  # 必須被引用的段落（每張圖至少在實施方式中被引用一次）
  ref_sections: [embodiments]
  pdf_label_pattern: '(?:圖|FIG\.?|Fig\.?)\s*(\d+[A-Za-z]?)|第\s*(\d+[A-Za-z]?)\s*圖'
  style_consistency: true          # 「圖1」與「第1圖」不可混用
  style_severity: 建議

rep_figure:
  pattern: '(?:圖|第)\s*[（(]?\s*(\d+[A-Za-z]?)\s*[）)]?\s*(?:圖)?'
  none_pattern: '(本案)?無(指定)?代表圖'
  severity: 必改

# ─────────────────────────────────────────
# D. 圖式 PDF
# ─────────────────────────────────────────
pdf:
  page_size_mm: {width: 210, height: 297, tolerance: 2}
  require_portrait: true
  rotate_severity: 建議
  font_embedded_severity: 必改
  no_text_layer_severity: 需人工確認
  color_severity: 必改
  gray_severity: 建議
  gray_tolerance: 8             # RGB 三色差距在此內視為灰階
  min_dpi: 300
  min_label_height_mm: 3.2
  cap_height_ratio: 0.7         # 字高 ≈ 字級 × 此比例
  label_min_gap_mm: 3.0         # 圖號與其他標號最小距離
  ocr:
    enabled: true
    lang: 'chi_tra+eng'
    dpi: 400
  basis: 專利法施行細則第23條、電子申請圖式規範

# ─────────────────────────────────────────
# E. 語意層（選用，全部標需人工確認）
# ─────────────────────────────────────────
semantic:
  # 不呼叫 LLM 的固定字串檢查（程式可確定，但是否要改需人工判斷）
  strategic_phrases:
    - 供日後分案之用
    - 保留分案
    - 本發明不限於
    - 僅為例示
  strategic_severity: 需人工確認
  llm:
    enabled: false              # 預設關閉；未公開案件送 LLM 前請確認資料保留政策
    model: claude-opus-5-5
    effort: high
    max_chunk_chars: 20000
    categories: [錯字, 用語不一, 數值矛盾, 策略性字句]
